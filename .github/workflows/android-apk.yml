name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Semnare: secretele repo-ului au prioritate; dacă lipsesc, se folosește
      # keystore-ul din signing/ (repo privat, aplicație de uz personal).
      - name: Prepare signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "SIGN_STORE_PASS=$KS_PASS"
              echo "SIGN_KEY_ALIAS=$KEY_ALIAS"
              echo "SIGN_KEY_PASS=$KEY_PASS"
            } >> "$GITHUB_ENV"
          else
            cp signing/casamea-release.keystore "$RUNNER_TEMP/release.keystore"
            prop() { grep "^$1=" signing/signing.properties | cut -d= -f2-; }
            {
              echo "SIGN_STORE_PASS=$(prop storePassword)"
              echo "SIGN_KEY_ALIAS=$(prop keyAlias)"
              echo "SIGN_KEY_PASS=$(prop keyPassword)"
            } >> "$GITHUB_ENV"
          fi

      # R8 (activ implicit în SDK 58) elimină WorkDatabase_Impl din WorkManager →
      # crash la pornire în InitializationProvider. Aplicație privată: fără minificare.
      # Doar arm64 (telefoane) + x86_64 (emulatorul de test): APK de ~2× mai mic.
      # Același build produce și AAB-ul pentru Google Play (Internal testing)
      - name: Build release APK + AAB
        working-directory: android
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            -PreactNativeArchitectures=arm64-v8a,x86_64 \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$SIGN_STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$SIGN_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SIGN_KEY_PASS"

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Indexa-${BUILD_NUMBER}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/Indexa-${BUILD_NUMBER}.aab"

      - name: Upload APK for smoke test
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/Indexa-${{ github.run_number }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Indexa build ${{ github.run_number }}
          body: |
            Commit: ${{ github.sha }}
            ${{ github.event.head_commit.message }}
          files: |
            out/Indexa-${{ github.run_number }}.apk
            out/Indexa-${{ github.run_number }}.aab
          make_latest: true

  # Pornește APK-ul pe un emulator Android și salvează logcat-ul pe branch-ul
  # `diagnostics`, ca un crash la pornire să poată fi analizat.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/smoke-test.sh apk/*.apk smoke

      - name: Save diagnostics to branch
        if: always()
        run: |
          [ -d smoke ] || exit 0
          git config user.name "indexa-ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/diag && cp -r smoke/* /tmp/diag/
          git fetch origin diagnostics || true
          git checkout -B diagnostics
          git rm -rq --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/diag/* .
          echo "build ${{ github.run_number }} · ${{ github.sha }}" > BUILD.txt
          git add -A
          git commit -m "Smoke test build ${{ github.run_number }}" || true
          git push -f origin diagnostics
